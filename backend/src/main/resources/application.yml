spring:
  application:
    name: nova

  # Defaults match docker-compose.yml / .env.example so `docker compose up -d` + run just works.
  # Override with environment variables in any other environment.
  datasource:
    url: ${NOVA_DB_URL:jdbc:postgresql://localhost:5432/nova}
    username: ${NOVA_DB_USER:nova}
    password: ${NOVA_DB_PASSWORD:change-me-locally}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it and fails fast if not.
    hibernate:
      ddl-auto: validate
    # Don't keep a DB session open during view rendering: avoids hidden lazy-loading queries.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  session:
    jdbc:
      # Tables come from Flyway migration V2, not from Spring Session's own script
      initialize-schema: never

server:
  port: ${PORT:8080}
  error:
    # Never expose internals in error responses
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      # Sliding expiry: every request extends the session
      timeout: 14d
      # Cookie name and flags: see dev.nova.security.SessionCookieConfig

nova:
  # Filled in from pom.xml at build time (Spring Boot parent filters @...@ in application*.yml)
  version: '@project.version@'
  cors:
    # Comma-separated; empty = no cross-origin access (normal: dev and prod are same-origin via /api proxy)
    allowed-origins: ${NOVA_CORS_ORIGINS:}
  security:
    cookie-secure: ${NOVA_COOKIE_SECURE:false}   # true in production (HTTPS only)
    login-attempts: 5
    login-window: PT1M
  github:
    api-url: ${NOVA_GITHUB_API_URL:https://api.github.com}
    # Optional. Without it, profiles and repositories still work (GitHub's 60 requests/hour per IP);
    # the contribution calendar needs it (GitHub's GraphQL API always requires a token).
    # A fine-grained token with no extra permissions is enough for public data.
    server-token: ${GITHUB_SERVER_TOKEN:}
  notifications:
    # The generator runs a minute after start-up, then an hour after each run (every user, idempotent)
    initial-delay: PT1M
    interval: PT1H
    # Daily clean-up (UTC) of notifications read more than `retention` ago; unread ones are kept
    cleanup-cron: '0 17 3 * * *'
    retention: P90D
  demo:
    # "Try the demo": a temporary account with fictional data, deleted `lifetime` after it's made
    enabled: ${NOVA_DEMO_ENABLED:true}
    lifetime: PT24H
    # Limits for everyone together (they hold even if client IPs are spoofed) and per client IP
    per-hour: 60
    max-alive: 300
    per-ip-per-hour: 3
    # Expired accounts are deleted five minutes after start-up, then an hour after each run
    cleanup-initial-delay: PT5M
    cleanup-interval: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
