name: Bug report
description: Something in NOVA doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For a security problem, please use **Security → Report a vulnerability** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: I marked a class absent on the Attendance page and the percentage didn't change…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Live demo
        - Running locally (full stack)
        - Running locally (mock API, npm run dev:mock)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 141 on Windows 11, Safari on iPhone…
  - type: input
    id: reference
    attributes:
      label: Error reference (if shown)
      description: Error messages in NOVA show a "Reference" code that helps find the server log.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
