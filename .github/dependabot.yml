# Weekly dependency updates, grouped so minor and patch bumps arrive as one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies, frontend]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencies, backend]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
