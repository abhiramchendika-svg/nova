# Labels for issues and pull requests. Apply them with Actions → "Sync labels" → Run workflow.
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or improvement
- name: documentation
  color: 0075ca
  description: README and docs
- name: frontend
  color: 1d76db
  description: React app
- name: backend
  color: 5319e7
  description: Spring Boot API
- name: database
  color: 006b75
  description: Schema, migrations, queries
- name: accessibility
  color: fbca04
  description: Keyboard, screen readers, contrast, motion
- name: good first issue
  color: 7057ff
  description: Small, well-described, a good place to start
- name: help wanted
  color: 008672
  description: Extra attention is welcome
- name: dependencies
  color: 0366d6
  description: Dependency updates (Dependabot)
