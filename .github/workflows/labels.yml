name: Sync labels

# Run by hand (Actions → Sync labels → Run workflow) after changing .github/labels.yml.
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create or update each label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, yaml
          for label in yaml.safe_load(open('.github/labels.yml')):
              subprocess.run(['gh', 'label', 'create', label['name'], '--color', label['color'],
                              '--description', label.get('description', ''), '--force'], check=True)
              print('synced', label['name'])
          PY
