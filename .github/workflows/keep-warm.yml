name: Keep the demo warm

# Render's free instance sleeps after 15 idle minutes and takes a minute or more to wake. Pinging the
# health endpoint through the website every 10 minutes keeps it awake (one service running all month
# fits in Render's 750 free hours). GitHub may delay or skip scheduled runs, so the site still shows a
# "waking up" message when this misses. Set the repository variable NOVA_SITE_URL (Settings → Secrets
# and variables → Actions → Variables), e.g. https://nova-xyz.vercel.app — without it the job is skipped.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.NOVA_SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/v1/health
        env:
          SITE: ${{ vars.NOVA_SITE_URL }}
        # The health endpoint never touches the database, so Neon can still scale to zero
        run: curl --fail --silent --show-error --max-time 150 --retry 2 --retry-delay 15 "${SITE%/}/api/v1/health"
