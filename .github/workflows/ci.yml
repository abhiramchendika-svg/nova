name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, unit + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `sh ./mvnw` works even if the executable bit was lost when committing from Windows.
      # Integration tests use Testcontainers; GitHub's Ubuntu runners have Docker available.
      - name: Build and test
        run: sh ./mvnw --batch-mode --no-transfer-progress verify

  docker:
    name: Backend Docker image (build + AOT cache training)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The same image Render builds; fails here first if the Dockerfile or the training run breaks
      - name: Build image
        run: docker build --progress=plain -t nova-backend ./backend 2>&1 | tee build.log

      - name: AOT cache was created
        run: docker run --rm --entrypoint sh nova-backend -c 'test -s app.aot && ls -l app.aot'

  frontend:
    name: Frontend (lint, typecheck, test, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      # Phase 6d: what each first visit downloads (gzip) must stay within bundle-budget.json
      - name: Bundle size budget
        run: npm run size

      # Phase 7: vercel.json's Content-Security-Policy must allow exactly the built inline scripts
      - name: CSP matches the build
        run: npm run csp

      # Phase 6: accessibility (axe, WCAG 2.2 AA incl. colour contrast), reflow, keyboard and smoke
      # flows in a real browser, against the mock API, so no backend is needed here.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end checks
        run: npm run e2e

      - name: Keep the Playwright report when they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
